<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Arrow Out</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #111827;
      --ink: #e8edf5;
      --muted: #a5b0c2;
      --line: #263041;
      --accent: #f4b740;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --ink: #12161f;
        --muted: #4b5563;
        --line: #dfe3ea;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: 40px 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 2.2rem; letter-spacing: -0.02em; }
    p { margin: 0 0 20px; color: var(--muted); }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Arrow Out</h1>
    <p>A small arrow puzzle game for Android.</p>
    <p><a href="privacy.html">Privacy policy</a></p>
  </main>
</body>
</html>
